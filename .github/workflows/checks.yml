name: Build and protocol checks
on:
  push:
    branches: ['dev/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build, core checks and publish (no driver or device test)
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-unverified-on-device
          path: artifacts/windows-win-x64/
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Java protocol checks
        run: bash scripts/check-java-wire.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: C# to Java TCP interoperability with synthetic JPEG
        run: |
          dotnet build tests/TabletExtend.Checks -c Release
          python3 scripts/check-interop.py
      - name: Prepare SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build native APK and lint (no tablet test)
        working-directory: android
        run: bash gradlew assembleDebug lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-unverified-on-device
          path: android/app/build/outputs/apk/debug/app-debug.apk
